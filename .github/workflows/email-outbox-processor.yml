name: Email Outbox Processor

on:
  schedule:
    - cron: "*/5 * * * *"

  # Nos permite ejecutarlo manualmente para pruebas.
  workflow_dispatch:

jobs:
  process-email-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Process pending emails
        shell: bash
        env:
          EMAIL_PROCESSOR_SECRET: ${{ secrets.EMAIL_PROCESSOR_SECRET }}
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${EMAIL_PROCESSOR_SECRET}" \
            "https://mtg-display-cr.jeankarloscocos.workers.dev/api/email/process"