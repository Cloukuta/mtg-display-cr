name: Update Card Kingdom Prices

on:
  workflow_dispatch:
  schedule:
    # 09:30 UTC = 03:30 Costa Rica (UTC-6)
    - cron: "30 9 * * *"

permissions:
  contents: read

concurrency:
  group: update-cardkingdom-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install price updater dependencies
        run: python -m pip install --disable-pip-version-check ijson==3.4.0

      - name: Update Card Kingdom prices in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_cardkingdom_prices.py
